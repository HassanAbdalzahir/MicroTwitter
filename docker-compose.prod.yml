version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: microtwitter-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: microtwitter
    volumes:
      - mongodb_data:/data/db
    networks:
      - microtwitter-network
    # Don't expose MongoDB port in production
    # ports:
    #   - "27017:27017"

  # Backend API
  backend:
    build: ./backend
    container_name: microtwitter-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://root:password123@mongodb:27017/microtwitter?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - microtwitter-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Frontend Application
  frontend:
    build: ./frontend
    container_name: microtwitter-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://your-domain.com:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - microtwitter-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  mongodb_data:

networks:
  microtwitter-network:
    driver: bridge
